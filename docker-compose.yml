name: ${COMPOSE_PROJECT_NAME:-clinicflow}

services:
  db:
    image: postgres:16-alpine
    container_name: clinicflow-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:${POSTGRES_PORT}"
    volumes:
      - clinicflow_db_data:/var/lib/postgresql/data
      - ./docker/init-db.sql:/docker-entrypoint-initdb.d/01-init-db.sql:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: clinicflow-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
      DATABASE_C_URL : ${DATABASE_C_URL}
      DATABASE_URL: ${DATABASE_URL}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      CORS_ORIGIN: ${CORS_ORIGIN}
      COOKIE_SECURE: ${COOKIE_SECURE}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE}
      CLINIC_TIMEZONE: ${CLINIC_TIMEZONE}
      LOG_LEVEL: ${LOG_LEVEL}
      SEED_DATABASE: ${SEED_DATABASE}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD}
      SEED_STAFF_EMAIL_1: ${SEED_STAFF_EMAIL_1}
      SEED_STAFF_PASSWORD_1: ${SEED_STAFF_PASSWORD_1}
      SEED_STAFF_EMAIL_2: ${SEED_STAFF_EMAIL_2}
      SEED_STAFF_PASSWORD_2: ${SEED_STAFF_PASSWORD_2}
    ports:
      - "${API_PORT}:${API_PORT}"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:${API_PORT}/api/health').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_CLINIC_TIMEZONE: ${CLINIC_TIMEZONE}
        NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME}
    container_name: clinicflow-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: ${WEB_PORT}
      HOSTNAME: 0.0.0.0
    ports:
      - "${WEB_PORT}:${WEB_PORT}"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:${WEB_PORT}/login').then((r) => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  clinicflow_db_data:
